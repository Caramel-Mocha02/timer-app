<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>先輩に聞こう。</title>
    <meta
      name="description"
      content="5分間、ひとりで抱え込まずに相談するための思考タイマー。"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="timer-panel" aria-live="polite" aria-atomic="true">
        <div id="timer" class="timer" aria-label="残り時間">05:00</div>
      </main>

      <div class="controls" aria-label="タイマー操作">
        <button id="start-button" class="action-button start" type="button">START</button>
        <button id="stop-button" class="action-button stop" type="button">STOP</button>
      </div>

      <div class="planet" aria-hidden="true"></div>

      <div id="final-screen" class="final-screen" aria-live="assertive" hidden>
        <h1>よく頑張った。</h1>
        <p>先輩に聞こう。</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
